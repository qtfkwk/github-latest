[package]
name = "github-latest"
version = "0.4.5"
edition = "2024"
description = "Get latest tag(s) for GitHub repositories"
repository = "https://github.com/qtfkwk/github-latest"
license = "MIT"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive", "wrap_help"] }
clap-cargo = "0.18.3"
futures = "0.3.32"
reqwest = "0.13.2"
tokio = { version = "1.52.1", features = ["full"] }
urlencoding = "2.1.3"
veg = "0.6.5"
